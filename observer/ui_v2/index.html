<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Task Observer</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Task Observer</h1>
      <button id="refresh" class="icon-button" aria-label="새로 고침" title="새로 고침">↻</button>
    </header>
    <div id="health" role="status" aria-live="polite">관측 정보를 불러오는 중</div>
    <details id="diagnostics" hidden><summary id="diagnostic-summary">진단 보기</summary><pre id="diagnostic-text"></pre></details>
    <div id="message" role="status" hidden></div>
    <main id="home">
      <div class="home-toolbar">
        <label class="search-label"><span class="sr-only">태스크 검색</span><input id="search" type="search" placeholder="태스크 검색" autocomplete="off"></label>
        <div class="filters" role="group" aria-label="태스크 필터">
          <button id="filter-all" aria-pressed="true"><span id="all-label">전체</span> <span id="task-count">0</span></button>
          <button id="filter-errors" aria-pressed="false">확인 필요 <span id="error-count">0</span></button>
          <button id="filter-attention" aria-pressed="false" hidden>내가 할 일 <span id="attention-count">0</span></button>
          <button id="filter-new" aria-pressed="false" hidden>새 보고 <span id="new-count">—</span></button>
          <button id="filter-archive" aria-pressed="false" hidden>보관 <span id="archive-count">0</span></button>
        </div>
      </div>
      <div id="task-list" class="scroll" aria-label="태스크 목록"></div>
      <p id="empty" class="empty" hidden>등록된 태스크가 없습니다.</p>
    </main>
    <main id="detail" hidden>
      <div class="detail-header"><button id="back" class="back-button" aria-label="태스크 목록으로 돌아가기">‹ 뒤로</button><h2 id="detail-title"></h2></div>
      <div id="task-toolbar" hidden></div>
      <div id="detail-body" class="scroll"></div>
    </main>
    <div id="location-message" class="action-message" role="status" hidden></div>
    <footer><span id="last-success">마지막 성공 수집 · 확인 중</span><div class="footer-actions"><button id="state-folder" aria-label="데이터 폴더 열기" disabled>데이터 폴더</button><button id="show-diagnostics" aria-label="관측 진단 보기" aria-controls="diagnostics" aria-expanded="false">진단</button><button id="quit" aria-label="Task Observer 종료">종료</button></div></footer>
  </div>
</body>
</html>
