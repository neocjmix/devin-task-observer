const proposalBox=el('div',undefined,'section');proposalBox.append(el('h3','로컬 모델 제안'),el('p',localAnalysis?'수동 요청 시 선택한 원본 한 항목을 이 Mac의 로컬 모델로 전달합니다. 자동 추가된 컨텍스트가 포함될 수 있습니다. 결과는 미검증 제안이며 직접 선택해야 저장됩니다.':'로컬 분석이 꺼져 있습니다. 기존 제안은 확인할 수 있습니다.','muted'));for(const proposal of taskData.proposals){const card=el('div',undefined,'item');card.append(el('p',proposal.content),el('p','검증되지 않은 모델 제안 · '+proposal.status+' · 노드 '+proposal.node_id,'muted'));if(proposal.status==='pending'){const row=el('div',undefined,'row'),section=el('select');section.setAttribute('aria-label','제안 저장 섹션');for(const s of view.sections){const option=el('option',s.title);option.value=s.id;section.append(option)}row.append(section,btn('확인 후 추가',()=>run(async()=>{await api('/api/proposal/apply',{task_id:current,proposal_id:proposal.id,view_id:view.id,section_id:section.value,revision:view.revision});await loadDetail()})),btn('제안 거절',()=>run(async()=>{await api('/api/proposal/reject',{task_id:current,proposal_id:proposal.id});await loadDetail()})));card.append(row)}proposalBox.append(card)}if(localAnalysis&&analysisBudget)proposalBox.append(el('p','일일 예약 예산 (UTC '+analysisBudget.day_utc+'): '+analysisBudget.reserved+' / '+analysisBudget.limit+' 토큰 · 실패한 요청도 예약량을 유지합니다.','muted'));root.append(proposalBox);

for(const [sectionIndex,section] of view.sections.entries()){const box=el('div',undefined,'section'),head=el('div',undefined,'row');const sectionKey='section:'+section.id,sectionDraft=drafts.get(sectionKey),sectionName=el('input');sectionName.setAttribute('aria-label','섹션 이름');sectionName.value=sectionDraft?.value??section.title;sectionName.oninput=()=>{const old=drafts.get(sectionKey);drafts.set(sectionKey,{value:sectionName.value,revision:old?.revision??view.revision})};head.append(sectionName,btn('이름 저장',()=>run(async()=>{await api('/api/section/rename',{view_id:view.id,section_id:section.id,revision:(drafts.get(sectionKey)?.revision??view.revision),title:sectionName.value});drafts.delete(sectionKey);await loadDetail()})));if(sectionDraft&&sectionDraft.revision!==view.revision)head.append(btn('최신 버전에 이름 적용',()=>run(async()=>{await api('/api/section/rename',{view_id:view.id,section_id:section.id,revision:view.revision,title:sectionName.value});drafts.delete(sectionKey);await loadDetail()})));for(const [delta,label] of [[-1,'위로'],[1,'아래로']]){const next=sectionIndex+delta;if(next<0||next>=view.sections.length)continue;head.append(btn(label,()=>run(async()=>{const order=view.sections.map(s=>s.id);[order[sectionIndex],order[next]]=[order[next],order[sectionIndex]];await api('/api/section/reorder',{view_id:view.id,revision:view.revision,ordered_ids:order});await loadDetail()})))}box.append(head);
for(const [itemIndex,item] of section.items.entries()){const card=el('div',undefined,'item'),row=el('div',undefined,'row');row.append(el('span',item.status,'badge'),el('span',item.pinned?'고정됨':item.origin==='local_model'?'모델 제안에서 추가됨 · 미검증':'수동 항목','muted'));card.append(row);const edit=el('textarea');edit.setAttribute('aria-label','항목 내용');const itemDraft=drafts.get(item.id);edit.value=itemDraft?.value??item.content;edit.oninput=()=>{const old=drafts.get(item.id);drafts.set(item.id,{value:edit.value,revision:old?.revision??view.revision})};card.append(edit);const actions=el('div',undefined,'row');actions.append(btn('저장',()=>run(async()=>{await api('/api/item/edit',{view_id:view.id,item_id:item.id,revision:(drafts.get(item.id)?.revision??view.revision),content:edit.value});drafts.delete(item.id);await loadDetail()}),'primary'),btn(item.pinned?'고정 해제':'고정',()=>run(async()=>{await api('/api/item/edit',{view_id:view.id,item_id:item.id,revision:view.revision,pinned:!item.pinned});await loadDetail()})));const status=el('select');status.setAttribute('aria-label','항목 상태');for(const [v,l] of [['open','열림'],['resolved','해결'],['superseded','대체됨'],['retracted','철회됨']]){const o=el('option',l);o.value=v;o.selected=item.status===v;status.append(o)}actions.append(status,btn('상태 변경',()=>run(async()=>{await api('/api/item/edit',{view_id:view.id,item_id:item.id,revision:view.revision,status:status.value});await loadDetail()})));card.append(actions);const moveRow=el('div',undefined,'row');for(const [delta,label] of [[-1,'항목 위로'],[1,'항목 아래로']]){const target=itemIndex+delta;if(target<0||target>=section.items.length)continue;moveRow.append(btn(label,()=>run(async()=>{await api('/api/item/move',{view_id:view.id,item_id:item.id,section_id:section.id,position:target,revision:view.revision});await loadDetail()})))}const destinations=view.sections.filter(s=>s.id!==section.id);if(destinations.length){const destination=el('select');destination.setAttribute('aria-label','이동할 섹션');for(const s of destinations){const o=el('option',s.title);o.value=s.id;destination.append(o)}moveRow.append(destination,btn('섹션으로 이동',()=>run(async()=>{const target=view.sections.find(s=>s.id===destination.value);await api('/api/item/move',{view_id:view.id,item_id:item.id,section_id:target.id,position:target.items.length,revision:view.revision});await loadDetail()})))}card.append(moveRow);if(itemDraft&&itemDraft.revision!==view.revision){card.append(el('p','저장된 뷰가 변경되었습니다. 현재 저장된 내용: '+item.content,'muted'),btn('현재 버전 기준으로 입력 저장',()=>run(async()=>{await api('/api/item/edit',{view_id:view.id,item_id:item.id,revision:view.revision,content:edit.value});drafts.delete(item.id);await loadDetail()})))}
if(evidenceSession&&evidenceNodes.length){const evrow=el('div',undefined,'row'),evsel=el('select');evsel.setAttribute('aria-label','연결할 근거');for(const n of evidenceNodes){const o=el('option',n.role+' · 노드 '+n.node_id+(n.present?'':' · 이전 기록'));o.value=String(n.node_id)+'|'+n.content_hash;evsel.append(o)}evrow.append(evsel,btn('근거 연결',()=>run(async()=>{const [node,hash]=evsel.value.split('|');await api('/api/evidence/attach',{view_id:view.id,item_id:item.id,revision:view.revision,session_id:evidenceSession,node_id:Number(node),content_hash:hash});await loadDetail()})));card.append(evrow)}
for(const evidence of item.evidence){const line=el('div',undefined,'row');line.append(el('span','근거 · 노드 '+evidence.node_id,'muted'),btn('원본 보기',()=>run(async()=>{const q=new URLSearchParams({task:current,session:evidence.session_id,node:String(evidence.node_id),hash:evidence.content_hash});const data=await api('/api/evidence?'+q);card.append(...evidenceElements(data))})));card.append(line)}box.append(card)}
const add=el('textarea');add.setAttribute('aria-label',section.title+' 새 항목');add.placeholder='직접 추가할 내용';const draftKey='new:'+section.id;add.value=drafts.get(draftKey)||'';add.oninput=()=>drafts.set(draftKey,add.value);box.append(add,btn('항목 추가',()=>run(async()=>{await api('/api/item/add',{view_id:view.id,section_id:section.id,revision:view.revision,content:add.value});drafts.delete(draftKey);await loadDetail()})));root.append(box)}
const sectionRow=el('div',undefined,'row'),newSection=el('input'),sectionDraftKey='new-section:'+current;newSection.setAttribute('aria-label','새 섹션 이름');newSection.placeholder='새 섹션 이름';newSection.value=drafts.get(sectionDraftKey)||'';newSection.oninput=()=>drafts.set(sectionDraftKey,newSection.value);sectionRow.append(newSection,btn('섹션 추가',()=>run(async()=>{await api('/api/section/add',{view_id:view.id,revision:view.revision,title:newSection.value});drafts.delete(sectionDraftKey);await loadDetail()})));root.append(sectionRow)}
$('create').onsubmit=e=>{e.preventDefault();run(async()=>{const result=await api('/api/task/create',{title:$('title').value,description:$('description').value});$('title').value='';$('description').value='';navigateTask(result.id);await loadState();await loadDetail()})};$('refresh').onclick=()=>run(async()=>{const result=await api('/api/refresh',{});if(!result.ok)show('관측 중입니다. 잠시 후 다시 확인해 주세요.');await loadState();if(currentSession)await loadSession()});run(loadState);setInterval(()=>{if(!document.hidden)loadState().catch(()=>{$('source').textContent='세션 관측 상태를 읽지 못했습니다'})},5000);
</script></body></html>
